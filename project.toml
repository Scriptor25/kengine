[artifact]
group = "dev.example"
version = "1.0.0"

[modules]
include = [
    "app",
    "engine",
]

[repositories]
maven = [
    "local",
    "https://repo1.maven.org/maven2/",
]

[dependencies]
maven = [
    "org.jetbrains.kotlin:kotlin-stdlib:2.4.21",
]

[compiler]
platform = "jvm"

[compiler.common]
kotlinVersion = "2.4.21"

[compiler.jvm]
addModules = [
    "jdk.incubator.vector",
]
